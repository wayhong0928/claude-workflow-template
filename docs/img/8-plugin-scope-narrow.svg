<svg xmlns="http://www.w3.org/2000/svg" width="350" height="676" viewBox="0 0 350 676" role="img" aria-labelledby="8-plugin-scopenn-t">
<title id="8-plugin-scopenn-t">plugin 帶得了 hook、skill 與 agent。帶不了規則檔、CLAUDE.md、permissions.deny 和狀態列，這四樣由 setup skill 在你同意後寫進專案，或只告訴你怎麼做。</title>
<style>
.dg-bg{fill:#f6f7f9}
.dg-box{fill:#fff;stroke:#b9c2cc;stroke-width:1.5}
.dg-key{fill:#e6eef6;stroke:#2f5d8a;stroke-width:1.5}
.dg-you{fill:#e7f2ea;stroke:#4f8a5b;stroke-width:1.5}
.dg-note{fill:none;stroke:#6b7480;stroke-width:1.2;stroke-dasharray:5 4}
.dg-line{fill:none;stroke:#5b6573;stroke-width:1.6}
.dg-dash{fill:none;stroke:#6b7480;stroke-width:1.4;stroke-dasharray:5 4}
.dg-head{fill:#5b6573}
.dg-t{fill:#1d232b;font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;font-size:15px;font-weight:700}
.dg-s{fill:#5b6573;font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;font-size:12.5px}
.dg-l{fill:#6b7480;font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;font-size:12px}
.dg-c{fill:#1d232b;font-family:Consolas,Menlo,monospace;font-size:13px;font-weight:600}
@media (prefers-color-scheme: dark){
.dg-bg{fill:#14181d}
.dg-box{fill:#1c2229;stroke:#4a5663}
.dg-key{fill:#22303d;stroke:#8fb6dd}
.dg-you{fill:#1f2f25;stroke:#6aa97a}
.dg-note{stroke:#8b96a3}
.dg-line{stroke:#9aa5b1}
.dg-dash{stroke:#8b96a3}
.dg-head{fill:#9aa5b1}
.dg-t,.dg-c{fill:#e4e8ed}
.dg-s{fill:#9aa5b1}
.dg-l{fill:#8b96a3}
}
</style>
<defs><marker id="8-plugin-scopenn-h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-head" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="dg-bg" x="0" y="0" width="350" height="676" rx="12"/>
<text class="dg-l" x="10" y="20" text-anchor="start">plugin 本身帶得了</text>
<rect class="dg-key" x="10" y="30" width="330" height="60" rx="10"/>
<text class="dg-t" x="24" y="54">hook</text>
<text class="dg-l" x="326" y="54" text-anchor="end">plugin 帶</text>
<text class="dg-s" x="24" y="76">7 個 hook，裝好就生效。</text>
<rect class="dg-key" x="10" y="102" width="330" height="60" rx="10"/>
<text class="dg-t" x="24" y="126">skill</text>
<text class="dg-l" x="326" y="126" text-anchor="end">plugin 帶</text>
<text class="dg-s" x="24" y="148">dispatch-template 和 setup。</text>
<rect class="dg-key" x="10" y="174" width="330" height="60" rx="10"/>
<text class="dg-t" x="24" y="198">agent</text>
<text class="dg-l" x="326" y="198" text-anchor="end">plugin 帶</text>
<text class="dg-s" x="24" y="220">verifier。</text>
<text class="dg-l" x="10" y="264" text-anchor="start">帶不了，由 setup 補或交給你</text>
<rect class="dg-box" x="10" y="276" width="330" height="78" rx="10"/>
<text class="dg-t" x="24" y="300">規則檔</text>
<text class="dg-l" x="326" y="300" text-anchor="end">setup 補</text>
<text class="dg-s" x="24" y="322">.claude/rules/dispatch-and-verify.md，複</text>
<text class="dg-s" x="24" y="340">製進專案，已有就不動。</text>
<rect class="dg-box" x="10" y="366" width="330" height="60" rx="10"/>
<text class="dg-t" x="24" y="390">CLAUDE.md</text>
<text class="dg-l" x="326" y="390" text-anchor="end">setup 補</text>
<text class="dg-s" x="24" y="412">沒有就依範本新建，有就列出缺的段落問你要不要補。</text>
<rect class="dg-box" x="10" y="438" width="330" height="78" rx="10"/>
<text class="dg-t" x="24" y="462">鎖原始資料</text>
<text class="dg-l" x="326" y="462" text-anchor="end">setup 補</text>
<text class="dg-s" x="24" y="484">permissions.deny 整段列給你看，同意才寫進</text>
<text class="dg-s" x="24" y="502">settings.json。</text>
<rect class="dg-you" x="10" y="528" width="330" height="78" rx="10"/>
<text class="dg-t" x="24" y="552">狀態列</text>
<text class="dg-l" x="326" y="552" text-anchor="end">你自己做</text>
<text class="dg-s" x="24" y="574">setup 不替你寫，只告訴你怎麼用 /statusline 設</text>
<text class="dg-s" x="24" y="592">定。</text>
<rect class="dg-key" x="12" y="624" width="22" height="14" rx="4"/>
<text class="dg-l" x="42" y="636">hook 自動做或自動擋</text>
<rect class="dg-box" x="180.4" y="624" width="22" height="14" rx="4"/>
<text class="dg-l" x="210.4" y="636">靠 Claude 照規則做</text>
<rect class="dg-you" x="12" y="646" width="22" height="14" rx="4"/>
<text class="dg-l" x="42" y="658">你做或你決定</text>
</svg>
